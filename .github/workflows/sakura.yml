name: Generate Sakura Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Generate Sakura SVG
        run: |
          # Buat folder khusus untuk hasil akhir
          mkdir -p dist
          curl -s https://ghchart.rshah.org/FF9EBB/Sony1866 > raw.svg
          
          # Tulis script Python ke dalam file untuk menghindari error spasi YAML
          cat << 'EOF' > generate.py
          import re

          with open("raw.svg", "r") as f:
              svg = f.read()

          # Ubah background menjadi gelap
          svg = svg.replace("<svg ", "<svg style=\"background-color:#0D1117; border-radius:10px; padding:10px;\" ")

          def rect_to_sakura(match):
              full_rect = match.group(0)
              # Jika kotak kosong / tidak ada commit
              if "#eeeeee" in full_rect.lower() or "data-score=\"0\"" in full_rect:
                  return re.sub(r"fill=\"[^\"]+\"", "fill=\"#161b22\" rx=\"2\" ry=\"2\"", full_rect)
              
              # Jika ada commit, ganti jadi 🌸
              x_m = re.search(r"x=\"([^\"]+)\"", full_rect)
              y_m = re.search(r"y=\"([^\"]+)\"", full_rect)
              if x_m and y_m:
                  x = float(x_m.group(1))
                  y = float(y_m.group(1)) + 9
                  return f"<text x=\"{x}\" y=\"{y}\" font-size=\"10\">🌸</text>"
              return full_rect

          sakura_svg = re.sub(r"<rect[^>]+/>", rect_to_sakura, svg)
          
          # Simpan ke folder dist
          with open("dist/sakura-contribution.svg", "w") as f:
              f.write(sakura_svg)
          EOF
          
          # Jalankan file Python
          python3 generate.py

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
